name: Deploy Düşünce Defteri (PWA Mobile) to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Grant GitHub Pages and contents write permissions
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite PWA
        run: npm run build:client

      - name: Sync compiled bundle to branch root (Ensures branch deployment works seamlessly)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp -f dist/index.html ./index.html
          cp -rf dist/assets ./
          git add index.html assets/
          git diff --staged --quiet || (git commit -m "build: compile assets for GitHub Pages branch deployment [skip ci]" && git push origin main)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (Actions mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
