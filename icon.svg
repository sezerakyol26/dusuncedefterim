<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background luxury dark mocha / espresso gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28221D" />
      <stop offset="45%" stop-color="#1B1714" />
      <stop offset="100%" stop-color="#100D0B" />
    </linearGradient>

    <!-- Warm ambient light bloom from top-center -->
    <radialGradient id="ambientGlow" cx="50%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#E8C99B" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#C5A059" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle rim bevel light -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="25%" stop-color="#EADEC9" stop-opacity="0.16" />
      <stop offset="80%" stop-color="#A2845E" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Champagne Gold gradient for spark & accents -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E4" />
      <stop offset="25%" stop-color="#F5DCB3" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A27D44" />
    </linearGradient>

    <!-- Silk Ivory page gradient (Left page) -->
    <linearGradient id="pageLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ECE2D0" />
      <stop offset="40%" stop-color="#FAF6EE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Silk Ivory page gradient (Right page) -->
    <linearGradient id="pageRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ECE2D0" />
      <stop offset="40%" stop-color="#FAF6EE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Leather / Notebook Cover Outer gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E6E45" />
      <stop offset="50%" stop-color="#6F5331" />
      <stop offset="100%" stop-color="#4E3920" />
    </linearGradient>

    <!-- Soft drop shadows -->
    <filter id="elevatedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for Mobile Homescreen & Desktop -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />

  <!-- Ambient Light Reflection inside squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#ambientGlow)" />

  <!-- Premium Inner Rim Bevel Stroke -->
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Central Notebook & Mind Symbol Group with Shadow -->
  <g filter="url(#elevatedShadow)">

    <!-- Under-cover base (Notebook back cover) -->
    <!-- Left Cover Flap -->
    <path d="M 256,368 C 220,378 160,370 120,344 C 114,340 110,334 110,326 L 110,224 C 110,216 116,210 124,213 C 166,228 220,230 256,218 Z" 
          fill="url(#coverGrad)" opacity="0.9" />
    
    <!-- Right Cover Flap -->
    <path d="M 256,368 C 292,378 352,370 392,344 C 398,340 402,334 402,326 L 402,224 C 402,216 396,210 388,213 C 346,228 292,230 256,218 Z" 
          fill="url(#coverGrad)" opacity="0.9" />

    <!-- Gold spine edge rim -->
    <path d="M 256,217 L 256,369" stroke="url(#goldSheen)" stroke-width="4" stroke-linecap="round" />

    <!-- Stacked Pages Layer 1 (Subtle depth under main pages) -->
    <path d="M 256,358 C 222,366 166,358 126,336 L 126,230 C 166,242 222,238 256,226 Z" 
          fill="#D6C7B2" opacity="0.75" />
    <path d="M 256,358 C 290,366 346,358 386,336 L 386,230 C 346,242 290,238 256,226 Z" 
          fill="#D6C7B2" opacity="0.75" />

    <!-- Main Open Pages: Left Page -->
    <path d="M 256,352 C 224,360 170,352 132,328 C 127,325 124,320 124,314 L 124,220 C 124,213 130,208 136,211 C 174,224 224,222 256,212 Z" 
          fill="url(#pageLeft)" />

    <!-- Main Open Pages: Right Page -->
    <path d="M 256,352 C 288,360 342,352 380,328 C 385,325 388,320 388,314 L 388,220 C 388,213 382,208 376,211 C 338,224 288,222 256,212 Z" 
          fill="url(#pageRight)" />

    <!-- Minimalist Notebook Lines on Left Page -->
    <path d="M 152,242 C 180,248 214,244 238,238" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 148,266 C 180,272 216,268 240,262" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 146,290 C 178,296 216,292 240,286" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 148,314 C 176,319 210,316 236,310" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    <!-- Minimalist Notebook Lines on Right Page -->
    <path d="M 274,238 C 298,244 332,248 360,242" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 272,262 C 296,268 332,272 364,266" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 272,286 C 296,292 334,296 366,290" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 276,310 C 302,316 336,319 364,314" stroke="#D1C4B0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    <!-- Elegant Silk Ribbon Bookmark flowing downwards -->
    <path d="M 252,213 L 260,213 L 260,378 L 256,373 L 252,378 Z" fill="url(#goldSheen)" />

    <!-- Spine Valley Shadow (Creates deep realistic book crease) -->
    <path d="M 256,212 L 256,352" stroke="#B09F87" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  </g>

  <!-- Golden Radiance Glow behind Star of Thought -->
  <circle cx="256" cy="148" r="42" fill="#E8C99B" opacity="0.18" filter="url(#sparkGlow)" />

  <!-- The Central Mind Spark / Star of Wisdom (✦) -->
  <!-- 4-Point Concave Diamond Star of Enlightenment -->
  <g filter="url(#elevatedShadow)">
    <!-- Main 4-pointed Star -->
    <path d="M 256,96 
             C 256,134 266,144 308,148 
             C 266,152 256,162 256,200 
             C 256,162 246,152 204,148 
             C 246,144 256,134 256,96 Z" 
          fill="url(#goldSheen)" />

    <!-- Center Core Glimmer -->
    <circle cx="256" cy="148" r="4" fill="#FFFFFF" />

    <!-- Subtle Satellite Sparks representing mindful clarity -->
    <!-- Left Satellite Spark -->
    <path d="M 188,124 
             C 188,133 191,135 200,136 
             C 191,137 188,139 188,148 
             C 188,139 185,137 176,136 
             C 185,135 188,133 188,124 Z" 
          fill="url(#goldSheen)" opacity="0.8" />

    <!-- Right Satellite Spark -->
    <path d="M 324,124 
             C 324,133 327,135 336,136 
             C 327,137 324,139 324,148 
             C 324,139 321,137 312,136 
             C 321,135 324,133 324,124 Z" 
          fill="url(#goldSheen)" opacity="0.8" />
  </g>
</svg>
